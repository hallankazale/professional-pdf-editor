name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "next.config.ts"
      - "capacitor.config.ts"
      - ".github/workflows/build-android-apk.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Executar testes
        run: npm test

      - name: Gerar aplicação web offline
        run: npm run build:android:web

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar aplicação no Android
        run: npx cap sync android

      - name: Gerar APK de instalação
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Editor-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
